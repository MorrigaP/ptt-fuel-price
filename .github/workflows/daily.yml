name: Daily fuel Price Fetch

on:
  schedule:
    - cron: "0 0 * * *"        # 07:00 เวลาไทย
  workflow_dispatch:
    inputs:
      simulate:
        description: "จำลองความล้มเหลว (ใช้ทดสอบเมลเท่านั้น)"
        type: choice
        default: none
        options:
          - none
          - fetch_fail
          - commit_fail

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run fetch script
        id: fetch
        timeout-minutes: 5
        run: |
          if [ "${{ inputs.simulate }}" = "fetch_fail" ]; then
            echo "SIMULATED: fetch script failure"
            exit 1
          fi
          python fetch_fuel.py

      - name: Commit data
        id: commit
        continue-on-error: true
        run: |
          if [ "${{ inputs.simulate }}" = "commit_fail" ]; then
            echo "SIMULATED: commit/push failure"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel_prices.csv
          git diff --staged --quiet || git commit -F commit_msg.txt
          git pull --rebase origin main
          git push

      - name: Prepare email body
        if: always()
        run: |
          if [ ! -f commit_msg.txt ]; then
            echo "ไม่มีข้อมูลราคา (fetch script ไม่สำเร็จ)" > commit_msg.txt
          fi
          {
            echo ""
            echo "---"
            echo "fetch : ${{ steps.fetch.outcome }}"
            echo "commit: ${{ steps.commit.outcome }}"
            echo "log   : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> commit_msg.txt

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Fuel Price Bot
          to: morriga.p@gmail.com , patiphon.boonpaisanseree@nykgroup.com , morriga-peace@hotmail.com
          subject: "ราคาน้ำมัน PTT | fetch: ${{ steps.fetch.outcome }} | commit: ${{ steps.commit.outcome }}"
          body: file://commit_msg.txt

      - name: Fail job if commit failed
        if: steps.commit.outcome == 'failure'
        run: exit 1
