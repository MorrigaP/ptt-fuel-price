name: Daily fuel Price Fetch

on:
  schedule:
    - cron: "0 0 * * *"        # 07:00 เวลาไทย
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install chromium

      - name: Run fetch script
        timeout-minutes: 5
        run: python fetch_fuel.py
        
      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Fuel Price Bot
          to: morriga.p@gmail.com , patiphon.boonpaisanseree@nykgroup.com , morriga-peace@hotmail.com
          subject: "ราคาน้ำมัน PTT ${{ job.status }}"
          body: file://commit_msg.txt
          
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fuel_prices.csv
          git diff --staged --quiet || git commit -F commit_msg.txt
          git pull --rebase origin main
          git push
