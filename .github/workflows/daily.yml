name: Daily fuel Price Fetch

on:
  schedule:
    - cron: "0 00 * * *"
  workflow_dispatch:   # test

permissions:
  contents: write      # ให้ commit กลับ repo ได้

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6          # ← เดิม v4 (แก้ warning Node 20)

      - name: Set up Python
        uses: actions/setup-python@v6      # ← เดิม v5 (แก้ warning Node 20)
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright
          playwright install --with-deps chromium   # ← เพิ่มบรรทัดนี้

      - name: Run fetch script
        run: python fetch_fuel.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add fuel_prices.csv
          git diff --staged --quiet || git commit -m "Update oil prices $(date +'%Y-%m-%d')"
          git push
